name: Verify group version

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify group version
    runs-on: ubuntu-latest
    concurrency:
      group: group-version-guard-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Create release App token
        id: release_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write

      - name: Mark version check pending
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" --method POST \
            -f state=pending -f context=group-version-guard \
            -f description='正在检查成员版本与本轮发布记录' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Verify changelog version
        id: verify
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          python3 - <<'PY'
          import base64
          import datetime
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.parse import urlencode

          import yaml

          MARKER = "<!-- group-release\n"

          def api(path, paginate=False):
              args = ["gh", "api", path]
              if paginate:
                  args += ["--paginate", "--slurp"]
              result = subprocess.run(args, capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError(f"GitHub API 失败: {path}: {result.stderr.strip()}")
              value = json.loads(result.stdout)
              return [item for page in value for item in page] if paginate else value

          def content(repo, path, sha):
              value = api(f"repos/{repo}/contents/{path}?{urlencode({'ref': sha})}")
              return base64.b64decode(value["content"]).decode("utf-8")

          def head_version(repo, sha):
              with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8") as f:
                  f.write(content(repo, "debian/changelog", sha))
                  f.flush()
                  result = subprocess.run(["dpkg-parsechangelog", "-l", f.name, "-S", "Version"],
                                          capture_output=True, text=True)
              if result.returncode or not result.stdout.strip():
                  raise RuntimeError(f"无法读取 {repo}@{sha} 的 changelog: {result.stderr.strip()}")
              return result.stdout.strip()

          def repo_names(cfg, group, owner):
              overrides = cfg.get("repo_overrides", {})
              return [f"{owner}/{overrides.get(m, m)}" for m in cfg["groups"][group]["members"]]

          def linglong_versions(repo, sha):
              tree = api(f"repos/{repo}/git/trees/{sha}")
              if tree.get("truncated") is not False or not isinstance(tree.get("tree"), list):
                  raise RuntimeError(f"无法完整检测 {repo}@{sha} 的 Linglong 版本文件")
              versions = {}
              for entry in tree["tree"]:
                  path = entry["path"]
                  if not re.fullmatch(r"linglong[^/]*\.yaml", path):
                      continue
                  if entry["type"] != "blob" or entry["mode"] not in ("100644", "100755"):
                      raise RuntimeError(f"{repo}@{sha} 的 {path} 不是普通版本文件")
                  try:
                      recipe = yaml.safe_load(content(repo, path, sha))
                      version = recipe["package"]["version"]
                  except (yaml.YAMLError, KeyError, TypeError) as error:
                      raise RuntimeError(f"无法读取 {repo}@{sha} 的 {path} package.version") from error
                  if (not isinstance(version, str) or not version.strip()
                          or subprocess.run(["dpkg", "--validate-version", version]).returncode):
                      raise RuntimeError(f"{repo}@{sha} 的 {path} version 无效")
                  versions[path] = version
              return versions

          def release_line(cfg, base):
              versions = cfg["groups"]["G2"]["versions"]
              lines = cfg.get("release_lines")
              if not isinstance(versions, dict) or not versions or not isinstance(lines, dict):
                  raise RuntimeError("G2 发布线配置缺失或异常")
              branches = []
              for line, value in lines.items():
                  branch = value.get("member_branch") if isinstance(value, dict) else None
                  if (not isinstance(line, str) or not re.fullmatch(r"[A-Za-z0-9._-]+", line)
                          or not isinstance(branch, str) or not branch
                          or (line == "master" and branch != "master")
                          or (line != "master" and not branch.startswith("develop/"))
                          or subprocess.run(["git", "check-ref-format", "--branch", branch],
                                            capture_output=True).returncode
                          or subprocess.run(["git", "check-ref-format", f"refs/heads/baseline/{line}/G2"],
                                            capture_output=True).returncode):
                      raise RuntimeError("G2 发布线 ID 或成员分支无效")
                  branches.append(branch)
              if len(branches) != len(set(branches)) or set(versions) != set(lines):
                  raise RuntimeError("G2 发布线成员分支映射不唯一或版本集合不符")
              matches = [line for line, value in lines.items() if value["member_branch"] == base]
              if len(matches) != 1 or matches[0] not in versions:
                  raise RuntimeError(f"G2 PR 目标分支 {base} 不属于唯一的发布线")
              return matches[0]

          def release_record(repo, sha, group, line=None):
              commit = api(f"repos/{repo}/git/commits/{sha}")
              for hops in range(101):
                  if MARKER in commit["message"]:
                      release = json.loads(commit["message"].split(MARKER, 1)[1].split("\n-->", 1)[0])
                      if (release["group"] != group
                              or (line is not None and release.get("release_line") != line)
                              or [p["sha"] for p in commit["parents"]] != [release["base_sha"]]):
                          raise RuntimeError("DDE 发布记录已改变，请先修复原基线 PR")
                      if group == "G2":
                          try:
                              started = datetime.datetime.strptime(release["started_at"], "%Y-%m-%dT%H:%M:%SZ")
                          except (KeyError, TypeError, ValueError) as error:
                              raise RuntimeError("DDE 本轮发布 started_at 缺失或无效") from error
                          if started.strftime("%Y-%m-%dT%H:%M:%SZ") != release["started_at"]:
                              raise RuntimeError("DDE 本轮发布 started_at 格式不符")
                      return release
                  if hops == 100 or len(commit["parents"]) != 2:
                      break
                  commit = api(f"repos/{repo}/git/commits/{commit['parents'][0]['sha']}")
              raise RuntimeError("DDE 基线 PR 缺少原始发布记录，请先核实")

          def check(repo, pr):
              before = head_version(repo, pr["base"]["sha"])
              source = pr["head"]["repo"]
              if not source:
                  raise RuntimeError("PR 来源仓库已删除，无法校验")
              after = head_version(source["full_name"], pr["head"]["sha"])
              if before != after and subprocess.run(["dpkg", "--compare-versions", after, "gt", before]).returncode:
                  raise RuntimeError(f"成员版本只能升版: {before} -> {after}")

              owner = repo.split("/", 1)[0]
              baseline = f"{owner}/dde"
              default = api(f"repos/{baseline}")["default_branch"]
              cfg = yaml.safe_load(content(baseline, "groups.yaml", default))
              groups = [g for g in cfg["groups"] if repo in repo_names(cfg, g, owner)]
              if before == after and "G2" not in groups:
                  return "changelog 版本未变化"
              if len(groups) != 1:
                  raise RuntimeError(f"{repo} 不属于唯一的 DDE 版本组，请核实分组配置")
              group = groups[0]
              recipes = {}
              line = None
              branch = f"baseline/{group}"
              baseline_version = cfg["groups"][group].get("version")
              if group == "G2":
                  if "versions" in cfg["groups"][group]:
                      line = release_line(cfg, pr["base"]["ref"])
                      branch = f"baseline/{line}/G2"
                      baseline_version = cfg["groups"][group]["versions"][line]
                  previous = linglong_versions(repo, pr["base"]["sha"])
                  recipes = linglong_versions(source["full_name"], pr["head"]["sha"])
                  removed = previous.keys() - recipes.keys()
                  if removed:
                      raise RuntimeError(f"G2 版本文件不能删除: {', '.join(sorted(removed))}")
                  for path, version in recipes.items():
                      if (path in previous and version != previous[path]
                              and subprocess.run(["dpkg", "--compare-versions", version, "gt",
                                                  previous[path]]).returncode):
                          raise RuntimeError(f"G2 {path} 版本只能升版: {previous[path]} -> {version}")
                  if before == after and previous == recipes:
                      return "版本信息未变化"
              query = urlencode({"state": "all", "head": f"{owner}:{branch}",
                                 "sort": "created", "direction": "desc", "per_page": 1})
              prs = api(f"repos/{baseline}/pulls?{query}")
              if not prs:
                  raise RuntimeError(f"{group} 没有统一发布记录，请从 DDE Release group 发起，不能单独改版")
              baseline_pr = prs[0]
              if (not baseline_pr["head"]["repo"] or baseline_pr["head"]["repo"]["full_name"] != baseline
                      or baseline_pr["head"]["ref"] != branch
                      or baseline_pr["base"]["ref"] != default):
                  raise RuntimeError("DDE 基线 PR 的来源或目标分支不符")
              release = release_record(baseline, baseline_pr["head"]["sha"], group, line)
              if (release["base_branch"] != default
                      or [m["repo"] for m in release["members"]] != repo_names(cfg, group, owner)
                      or (line is not None and any(m["base"] != pr["base"]["ref"] for m in release["members"]))):
                  raise RuntimeError("DDE 本轮成员或目标分支已改变，请先核实原发布")
              member = next(m for m in release["members"] if m["repo"] == repo)
              if "version" in member:
                  baseline_version = baseline_version.split(":", 1)[-1]
              if subprocess.run(["dpkg", "--compare-versions", release["version"], "ge", baseline_version]).returncode:
                  raise RuntimeError("DDE 发布记录已过期，不能继续旧版本")
              target = member.get("version", release["version"])
              if subprocess.run(["dpkg", "--validate-version", target]).returncode:
                  raise RuntimeError(f"无效成员目标版本: {target}")
              if "version" in member and target.split(":", 1)[-1] != release["version"]:
                  raise RuntimeError("成员目标版本与组版本不符")
              safe = re.sub(r"[^A-Za-z0-9._-]+", "-", target).strip("-")
              branch = f"release-{target}" if group == "G1" else f"automation/update-changelog/{safe}"
              if (after != target or source["full_name"] != repo or pr["head"]["ref"] != branch
                      or pr["base"]["ref"] != member["base"] or pr["created_at"] < release["started_at"]):
                  raise RuntimeError(f"{repo} 的改版 PR 不属于 {group} 本轮 {target}，请从 DDE Release group 发起")
              for path, version in recipes.items():
                  # Update changelog 保留 Linglong 版本末尾的一个数字段。
                  if not re.fullmatch(re.escape(target) + r"(?:\.[0-9]+)?", version):
                      raise RuntimeError(f"G2 {path} 版本 {version} 与本轮成员目标 {target} 不符")
              return f"{group} 本轮发布 {target}，成员 PR 与发布记录一致"

          def identity(pr):
              source = pr["head"]["repo"] or {}
              return {"number": pr["number"], "head_sha": pr["head"]["sha"],
                      "head_repo": source.get("full_name"), "head_ref": pr["head"]["ref"],
                      "base_ref": pr["base"]["ref"]}

          def main():
              repo = os.environ["GITHUB_REPOSITORY"]
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
                  event = json.load(f)
              pr = api(f"repos/{repo}/pulls/{event['number']}")
              if pr["head"]["sha"] != os.environ["PR_HEAD_SHA"]:
                  raise RuntimeError("PR 提交已变化，请等待新提交的检查")
              query = urlencode({"state": "open", "per_page": 100})
              related = api(f"repos/{repo}/pulls?{query}", paginate=True)
              open_prs = [p for p in related
                          if p["state"] == "open" and p["head"]["sha"] == os.environ["PR_HEAD_SHA"]]
              if not any(p["number"] == pr["number"] for p in open_prs) and pr["state"] == "open":
                  open_prs.append(pr)
              for item in open_prs:
                  check(repo, item)
              Path(os.environ["RUNNER_TEMP"], "verified-prs.json").write_text(
                  json.dumps(sorted((identity(pr) for pr in open_prs), key=lambda pr: pr["number"])) + "\n",
                  encoding="utf-8")
              print(f"同提交开放 PR 校验通过: {len(open_prs)}")

          if __name__ == "__main__":
              main()
          PY

      - name: Publish version check result
        if: always()
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          current_state=success
          if [ "$VERIFY_OUTCOME" != "success" ]; then
            current_state=failure
          fi
          if [ "$current_state" = success ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate --slurp \
                > "$RUNNER_TEMP/current-prs.json"; then
              echo '::error::无法刷新关联 PR，成员版本校验不能通过' >&2
              current_state=failure
            elif ! python3 - "$RUNNER_TEMP/verified-prs.json" "$RUNNER_TEMP/current-prs.json" "$PR_HEAD_SHA" <<'PY'
          import json
          import sys

          expected_file, current_file, head_sha = sys.argv[1:]
          with open(expected_file, encoding="utf-8") as f:
              expected = json.load(f)
          with open(current_file, encoding="utf-8") as f:
              pages = json.load(f)
          if pages and isinstance(pages[0], dict):
              pages = [pages]
          current = [item for page in pages for item in page]

          def identity(pr):
              source = pr["head"]["repo"] or {}
              return {"number": pr["number"], "head_sha": pr["head"]["sha"],
                      "head_repo": source.get("full_name"), "head_ref": pr["head"]["ref"],
                      "base_ref": pr["base"]["ref"]}

          current = sorted((identity(pr) for pr in current
                            if pr["state"] == "open" and pr["head"]["sha"] == head_sha),
                           key=lambda pr: pr["number"])
          if current != expected:
              print("::error::校验期间 PR 的目标、提交或开放集合发生变化，需要重新检查", file=sys.stderr)
              raise SystemExit(1)
          PY
            then
              current_state=failure
            fi
          fi
          if [ "$current_state" = "success" ]; then
            state=success
            description='成员版本校验通过'
          else
            state=failure
            description='成员版本校验失败，详见工作流日志'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" --method POST \
            -f state="$state" -f context=group-version-guard \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          test "$current_state" = success
