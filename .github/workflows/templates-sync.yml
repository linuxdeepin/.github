name: Workflow templates sync
on:
  push:
    paths:
      - ".github/workflows/templates-sync.yml"
      - "repos/**.json"
      - "workflow-templates/**.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates-sync:
    # limit push on linuxdeepin/.github master branch
    if: github.repository == 'linuxdeepin/.github' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Incremental sync when config changed
      - name: Get changed configs
        id: changed-configs
        uses: tj-actions/changed-files@v46
        with:
          separator: " "
          files: |
            repos/linuxdeepin/*.json
      # Full sync when file changed or workflow_dispatch event
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          separator: " "
          files: |
            workflow-templates/*.yml

      # Install ssh key and known_hosts
      - name: Git config
        env:
          SSH_KEY: ${{secrets.SYNC_SSH_KEY}}
          KNOWN_HOSTS: ${{secrets.SYNC_SSH_KNOWN_HOSTS}}
        run: |
          mkdir ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.name deepin-admin-bot
          git config --global user.email deepin-admin-bot@deepin.org

      - name: Sync changed configs
        uses: linuxdeepin/action-sync@main
        if: steps.changed-configs.outputs.any_changed == 'true' && steps.changed-files.outputs.any_changed != 'true'
        with:
          files: "${{ steps.changed-configs.outputs.all_changed_files }}"
          message: |
            chore: Sync by ${{ github.event.head_commit.url }}

            sync by github workflow

            Log: none
            Influence: none

      - name: Get all configs
        id: all-configs
        if: github.event_name != 'workflow_dispatch' && steps.changed-files.outputs.any_changed == 'true' && steps.changed-configs.outputs.any_changed != 'true'
        run: |
          all_configs=`find repos -type f | grep json | xargs`
          echo all configs $all_configs
          echo "ALL_CONFIGS=$all_configs" >> $GITHUB_OUTPUT
      - name: Sync all files
        uses: linuxdeepin/action-sync@main
        if: github.event_name != 'workflow_dispatch' && steps.changed-files.outputs.any_changed == 'true' && steps.changed-configs.outputs.any_changed != 'true'
        with:
          files: "${{ steps.all-configs.outputs.ALL_CONFIGS }}"
          message: |
            chore: Sync by ${{ github.event.head_commit.url }}

            sync by github workflow

            Log: none
            Influence: none

      - name: Prepare release-line sync configs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.changed-configs.outputs.any_changed == 'true')
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          names = {
              "call-update-changelog.yml": Path(".github/release-line-update.json"),
              "call-verify-group-version.yml": Path(".github/release-line-guard.json"),
          }
          output = {name: [] for name in names}
          for path in Path("repos", owner).glob("*.json"):
              found = {}
              for entry in json.loads(path.read_text(encoding="utf-8")):
                  name = Path(entry.get("src", "")).name
                  if name in names and entry.get("dest", "").startswith(f"{owner}/"):
                      found[name] = entry
              if set(found) == set(names):
                  for name, entry in found.items():
                      output[name].append(entry)
          for name, entries in output.items():
              if not entries:
                  raise RuntimeError(f"missing release-line config: {name}")
              names[name].write_text(json.dumps(entries, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Sync release-line update template
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.changed-configs.outputs.any_changed == 'true')
        uses: linuxdeepin/action-sync@main
        with:
          files: .github/release-line-update.json
          message: |
            chore: Sync release-line update template

            Log: none
            Influence: none

      - name: Sync release-line guard template
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.changed-configs.outputs.any_changed == 'true')
        uses: linuxdeepin/action-sync@main
        with:
          files: .github/release-line-guard.json
          message: |
            chore: Sync release-line guard template

            Log: none
            Influence: none
